# PERFORMANCE — Load Balancer + CDN cache headers
#
# Drop-in Nginx config. Two pieces:
#
#   1. An `upstream` block load-balancing across N app servers running
#      this Laravel app (same codebase/DB, e.g. behind a deploy tool
#      or autoscaling group) instead of one box taking all traffic.
#   2. Long-lived cache headers on public/build/* (the hashed,
#      immutable assets Vite outputs) so a CDN placed in front of this
#      (CloudFront/Cloudflare/etc.) can cache and serve them without
#      re-hitting the app servers at all — see .env's ASSET_URL and
#      vite.config.js's `base` for the app-side half of this.
#
# Adjust `server <host>:<port>` lines to your actual app server
# addresses (or container/service names) before deploying. This file
# is a starting point, not a drop-in-blind config — review timeouts,
# TLS termination, and health-check behavior for your environment
# before using it in production.

upstream classly_app_servers {
    # least_conn sends each new request to whichever backend currently
    # has the fewest open connections — a better fit than round-robin
    # for a mix of fast (list pages, now cached) and slow (schedule
    # generation, report exports) requests.
    least_conn;

    server 10.0.0.11:9000 max_fails=3 fail_timeout=30s;
    server 10.0.0.12:9000 max_fails=3 fail_timeout=30s;
    server 10.0.0.13:9000 max_fails=3 fail_timeout=30s backup;

    keepalive 32;
}

server {
    listen 80;
    server_name classly.example.edu;

    root /var/www/classly_2.0/public;
    index index.php;

    # gzip for anything that slips past the app-level
    # CompressApiPayload middleware (static files, HTML, etc.)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 860;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml font/woff2;
    gzip_vary on;

    # CDN / browser caching for Vite's hashed, immutable build output.
    # Safe to cache for a year because the filename itself changes on
    # every rebuild (e.g. app-4f9a2c1e.js) — a new deploy never reuses
    # an old, now-stale URL.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (uploaded photos/logos under storage/, favicon,
    # etc.) — cache, but revalidate periodically since these CAN
    # change without a filename change (e.g. a re-uploaded profile
    # photo keeps a stable public URL).
    location ~* \.(?:jpg|jpeg|png|gif|webp|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass classly_app_servers;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}